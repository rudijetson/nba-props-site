<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Props · 2026-01-14</title>
  <style>
    /*
     * ========================================
     * DESIGN SYSTEM - COLOR TOKENS
     * ========================================
     *
     * BACKGROUNDS
     *   --bg-primary    : Page background
     *   --bg-secondary  : Cards, table rows
     *   --bg-tertiary   : Headers, inputs, hover states
     *   --bg-hover      : Row/button hover state
     *
     * BORDERS
     *   --border        : Dividers, card borders, table lines
     *
     * TEXT
     *   --text-primary  : Headings, player names, key data
     *   --text-secondary: Body text, descriptions
     *   --text-muted    : Labels, disabled, secondary info
     *
     * ACCENT
     *   --accent        : Primary action (buttons, links, active states)
     *   --accent-hover  : Accent hover state
     *
     * SEMANTIC COLORS
     *   --green / --green-bg  : STRONG tier, wins, overs, positive
     *   --blue / --blue-bg    : LEAN tier, pending, info
     *   --amber / --amber-bg  : WATCH tier, unders, warnings
     *   --red / --red-bg      : Losses, risks, errors
     *
     * ========================================
     */

    :root {
      /* Backgrounds */
      --bg-primary: #0f1117;
      --bg-secondary: #1a1d27;
      --bg-tertiary: #242833;
      --bg-hover: #2a2f3d;

      /* Borders */
      --border: #2e3341;

      /* Text */
      --text-primary: #f1f3f5;
      --text-secondary: #8b92a5;
      --text-muted: #5c6370;

      /* Accent */
      --accent: #6366f1;
      --accent-hover: #818cf8;

      /* Semantic: Green (STRONG, wins, positive) */
      --green: #22c55e;
      --green-bg: rgba(34, 197, 94, 0.12);

      /* Semantic: Red (losses, risks) */
      --red: #ef4444;
      --red-bg: rgba(239, 68, 68, 0.12);

      /* Semantic: Blue (LEAN, info) */
      --blue: #3b82f6;
      --blue-bg: rgba(59, 130, 246, 0.12);

      /* Semantic: Amber (WATCH, unders) */
      --amber: #f59e0b;
      --amber-bg: rgba(245, 158, 11, 0.12);
    }

    [data-theme="light"] {
      /* Backgrounds */
      --bg-primary: #f8fafc;
      --bg-secondary: #ffffff;
      --bg-tertiary: #f1f5f9;
      --bg-hover: #e2e8f0;

      /* Borders */
      --border: #e2e8f0;

      /* Text */
      --text-primary: #0f172a;
      --text-secondary: #475569;
      --text-muted: #94a3b8;

      /* Accent */
      --accent: #6366f1;

      /* Semantic colors (slightly darker for light bg) */
      --green: #16a34a;
      --green-bg: rgba(22, 163, 74, 0.1);
      --red: #dc2626;
      --red-bg: rgba(220, 38, 38, 0.1);
      --blue: #2563eb;
      --blue-bg: rgba(37, 99, 235, 0.1);
      --amber: #d97706;
      --amber-bg: rgba(217, 119, 6, 0.1);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      overflow: hidden;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      line-height: 1.5;
      font-size: 13px;
      -webkit-font-smoothing: antialiased;
    }

    .container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 20px;
      height: 100%;
      display: flex;
      flex-direction: column;
    }

    /* Header */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .logo {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: -0.5px;
      color: var(--text-primary);
    }

    .logo span {
      color: var(--accent);
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .date-nav {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .date-nav a {
      color: var(--text-muted);
      text-decoration: none;
      padding: 6px 10px;
      border-radius: 6px;
      transition: all 0.15s;
    }

    .date-nav a:hover {
      color: var(--text-primary);
      background: var(--bg-tertiary);
    }

    .date-current {
      color: var(--text-secondary);
      font-size: 12px;
      font-weight: 500;
    }

    .search-box {
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 12px;
      color: var(--text-primary);
      font-size: 12px;
      width: 180px;
      transition: all 0.15s;
    }

    .search-box::placeholder { color: var(--text-muted); }
    .search-box:focus {
      outline: none;
      border-color: var(--accent);
      background: var(--bg-tertiary);
    }

    /* Stats Bar */
    .stats-bar {
      display: flex;
      gap: 24px;
      padding: 16px 20px;
      background: var(--bg-secondary);
      border-radius: 12px;
      margin-bottom: 16px;
      border: 1px solid var(--border);
      flex-shrink: 0;
    }

    .stat-item {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .stat-label {
      font-size: 10px;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-muted);
    }

    .stat-value {
      font-size: 18px;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
    }

    .stat-value.positive { color: var(--green); }
    .stat-value.negative { color: var(--red); }

    .stat-divider {
      width: 1px;
      background: var(--border);
      margin: 0 8px;
    }

    /* Filters */
    .filters {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
      flex-wrap: wrap;
      flex-shrink: 0;
    }

    .filter-group {
      display: flex;
      background: var(--bg-secondary);
      border-radius: 8px;
      padding: 3px;
      border: 1px solid var(--border);
    }

    .filter-btn {
      padding: 6px 12px;
      border: none;
      border-radius: 6px;
      background: transparent;
      color: var(--text-secondary);
      font-size: 11px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s;
    }

    .filter-btn:hover {
      color: var(--text-primary);
      background: var(--bg-tertiary);
    }

    .filter-btn.active {
      background: var(--accent);
      color: white;
    }

    .filter-btn.strong { color: var(--green); }
    .filter-btn.lean { color: var(--blue); }
    .filter-btn.watch { color: var(--amber); }

    .count {
      font-size: 11px;
      color: var(--text-muted);
    }

    .table-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      flex-shrink: 0;
    }

    /* Table */
    .table-container {
      background: var(--bg-secondary);
      border-radius: 12px;
      border: 1px solid var(--border);
      overflow: hidden;
      position: relative;
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
    }

    .table-scroll {
      overflow: auto;
      flex: 1;
    }

    table {
      width: 100%;
      border-collapse: separate;
      border-spacing: 0;
    }

    th {
      background: var(--bg-tertiary);
      padding: 12px 16px;
      text-align: left;
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-muted);
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      user-select: none;
      white-space: nowrap;
      position: sticky;
      top: 0;
      z-index: 20;
    }

    th:first-child {
      position: sticky;
      left: 0;
      z-index: 30;
    }

    th:hover { color: var(--text-secondary); }
    th.sorted-asc::after { content: ' ↑'; opacity: 0.5; }
    th.sorted-desc::after { content: ' ↓'; opacity: 0.5; }

    td {
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
      vertical-align: middle;
      background: var(--bg-secondary);
    }

    td:first-child {
      position: sticky;
      left: 0;
      z-index: 10;
      background: var(--bg-secondary);
      min-width: 180px;
    }

    tr:last-child td { border-bottom: none; }

    tr:hover td {
      background: var(--bg-hover);
    }

    tr:hover td:first-child {
      background: var(--bg-hover);
    }

    .player-cell {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .player-name {
      font-weight: 500;
      color: var(--text-primary);
      white-space: nowrap;
    }

    .player-team {
      font-size: 11px;
      color: var(--text-muted);
      white-space: nowrap;
    }

    /* Tier Badges */
    .tier {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 10px;
      border-radius: 6px;
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.3px;
      cursor: default;
      position: relative;
    }

    .tier.strong {
      background: var(--green-bg);
      color: var(--green);
    }

    .tier.lean {
      background: var(--blue-bg);
      color: var(--blue);
    }

    .tier.watch {
      background: var(--amber-bg);
      color: var(--amber);
    }

    .tier.skip {
      background: var(--bg-tertiary);
      color: var(--text-muted);
    }

    .tier .conf {
      font-size: 9px;
      opacity: 0.7;
      font-weight: 500;
    }

    /* Tooltip - appears below to avoid header cutoff */
    .tier-wrap {
      position: relative;
      display: inline-block;
    }

    .tier-tip {
      position: absolute;
      top: calc(100% + 10px);
      left: 50%;
      transform: translateX(-50%) scale(0.95);
      background: var(--bg-tertiary);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px 16px;
      width: 260px;
      opacity: 0;
      visibility: hidden;
      transition: all 0.2s ease;
      z-index: 1000;
      box-shadow: 0 8px 24px rgba(0,0,0,0.4);
      pointer-events: none;
    }

    .tier-tip::before {
      content: '';
      position: absolute;
      bottom: 100%;
      left: 50%;
      transform: translateX(-50%);
      border: 8px solid transparent;
      border-bottom-color: var(--bg-tertiary);
    }

    .tier-wrap:hover .tier-tip {
      opacity: 1;
      visibility: visible;
      transform: translateX(-50%) scale(1);
    }

    .tip-section {
      margin-bottom: 12px;
    }

    .tip-section:last-child { margin-bottom: 0; }

    .tip-label {
      font-size: 9px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-muted);
      margin-bottom: 4px;
    }

    .tip-text {
      font-size: 12px;
      color: var(--text-secondary);
      line-height: 1.5;
    }

    .tip-risks {
      color: var(--red);
      opacity: 0.9;
    }

    .tip-edge {
      display: flex;
      justify-content: space-between;
      padding-top: 10px;
      margin-top: 10px;
      border-top: 1px solid var(--border);
      font-size: 11px;
    }

    .tip-edge span:first-child { color: var(--text-muted); }
    .tip-edge span:last-child { font-weight: 600; color: var(--text-primary); }

    /* Direction Pills */
    .dir {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.3px;
    }

    .dir.over {
      background: var(--green-bg);
      color: var(--green);
    }

    .dir.under {
      background: var(--amber-bg);
      color: var(--amber);
    }

    /* Result States */
    .result {
      font-weight: 600;
      font-size: 11px;
      text-transform: uppercase;
    }

    .result.win { color: var(--green); }
    .result.loss { color: var(--red); }
    .result.pending { color: var(--text-muted); }
    .result.void { color: var(--text-muted); }

    .actual { font-variant-numeric: tabular-nums; }
    .actual.hit { color: var(--green); }
    .actual.miss { color: var(--red); }

    /* Wager Button */
    .wager-btn {
      padding: 5px 10px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--bg-tertiary);
      color: var(--text-secondary);
      font-size: 11px;
      font-weight: 500;
      cursor: pointer;
      min-width: 42px;
      transition: all 0.15s;
    }

    .wager-btn:hover {
      border-color: var(--accent);
      color: var(--text-primary);
    }

    .wager-btn.active {
      background: var(--accent);
      border-color: var(--accent);
      color: white;
    }

    /* Parlay Button */
    .parlay-add {
      padding: 3px 6px;
      border: 1px solid var(--border);
      border-radius: 4px;
      background: transparent;
      color: var(--text-muted);
      font-size: 12px;
      cursor: pointer;
      margin-left: 8px;
      transition: all 0.15s;
    }

    .parlay-add:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .parlay-add.in-parlay {
      background: var(--accent);
      border-color: var(--accent);
      color: white;
    }

    /* Detail columns */
    .detail-col.hidden { display: none; }

    .toggle-btn {
      padding: 6px 12px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--bg-secondary);
      color: var(--text-secondary);
      font-size: 11px;
      cursor: pointer;
      transition: all 0.15s;
    }

    .toggle-btn:hover {
      border-color: var(--accent);
      color: var(--text-primary);
    }

    .no-data {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-muted);
    }

    /* Parlay Bar */
    .parlay-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: var(--bg-secondary);
      border-top: 1px solid var(--border);
      transform: translateY(100%);
      transition: transform 0.3s ease;
      z-index: 100;
    }

    .parlay-bar.visible { transform: translateY(0); }

    body.has-parlay { padding-bottom: 56px; }

    .parlay-tabs {
      display: flex;
      gap: 4px;
      padding: 10px 20px 0;
      border-bottom: 1px solid var(--border);
    }

    .parlay-tab {
      padding: 8px 14px;
      font-size: 11px;
      border: none;
      background: var(--bg-tertiary);
      border-radius: 8px 8px 0 0;
      cursor: pointer;
      color: var(--text-secondary);
      transition: all 0.15s;
    }

    .parlay-tab:hover { background: var(--bg-hover); }
    .parlay-tab.active { background: var(--bg-primary); color: var(--text-primary); }
    .parlay-tab.add { background: transparent; color: var(--accent); }

    .parlay-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 20px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
    }

    .parlay-header:hover { background: var(--bg-hover); }

    .parlay-details {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.3s ease;
      padding: 0 20px;
    }

    .parlay-details.expanded {
      max-height: 300px;
      padding: 12px 20px;
    }

    .parlay-leg {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      font-size: 12px;
      border-bottom: 1px solid var(--border);
    }

    .parlay-leg:last-child { border-bottom: none; }
    .parlay-leg .remove { cursor: pointer; color: var(--red); padding: 0 6px; }

    /* Mobile */
    @media (max-width: 768px) {
      .container { padding: 12px; }
      .header { flex-direction: column; gap: 12px; align-items: flex-start; }
      .stats-bar { gap: 16px; padding: 12px 16px; }
      .stat-value { font-size: 15px; }
      th, td { padding: 10px 12px; }
      .search-box { width: 140px; }
      .table-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
      table { min-width: 700px; }
    }
  </style>
</head>
<body>
  <div class="container">
    <header class="header">
      <div class="logo">Props<span>Lab</span></div>
      <div class="header-right">
        <div class="date-nav">
          <a href="picks_2026-01-13.html">←</a>
          <span class="date-current">Jan 14, 2026</span>
          <a href="picks_2026-01-15.html">→</a>
        </div>
        <input type="text" class="search-box" id="searchInput" placeholder="Search player...">
        <button class="toggle-btn" id="themeToggle" onclick="toggleTheme()">☀</button>
      </div>
    </header>

    <div class="stats-bar">
      <div class="stat-item">
        <span class="stat-label">Record</span>
        <span class="stat-value" id="record">—</span>
      </div>
      <div class="stat-item">
        <span class="stat-label">Win Rate</span>
        <span class="stat-value" id="winRate">—</span>
      </div>
      <div class="stat-item">
        <span class="stat-label">Pending</span>
        <span class="stat-value" id="pending">—</span>
      </div>
      <div class="stat-divider"></div>
      <div class="stat-item">
        <span class="stat-label">Wagered</span>
        <span class="stat-value" id="totalWagered">$0</span>
      </div>
      <div class="stat-item">
        <span class="stat-label">Profit</span>
        <span class="stat-value" id="totalProfit">$0</span>
      </div>
      <div class="stat-item">
        <span class="stat-label">ROI</span>
        <span class="stat-value" id="wagerRoi">—</span>
      </div>
    </div>

    <div class="filters">
      <div class="filter-group" data-filter="stat">
        <button class="filter-btn active" data-value="all">All</button>
        <button class="filter-btn" data-value="points">PTS</button>
        <button class="filter-btn" data-value="rebounds">REB</button>
        <button class="filter-btn" data-value="assists">AST</button>
      </div>
      <div class="filter-group" data-filter="direction">
        <button class="filter-btn active" data-value="all">All</button>
        <button class="filter-btn" data-value="OVER">Over</button>
        <button class="filter-btn" data-value="UNDER">Under</button>
      </div>
      <div class="filter-group" data-filter="tier">
        <button class="filter-btn active" data-value="all">All</button>
        <button class="filter-btn strong" data-value="strong">Strong</button>
        <button class="filter-btn lean" data-value="lean">Lean</button>
        <button class="filter-btn watch" data-value="watch">Watch</button>
      </div>
      <div class="filter-group" data-filter="result">
        <button class="filter-btn active" data-value="all">All</button>
        <button class="filter-btn" data-value="WIN">W</button>
        <button class="filter-btn" data-value="LOSS">L</button>
        <button class="filter-btn" data-value="PENDING">Pend</button>
      </div>
      <div class="filter-group" data-filter="wagered">
        <button class="filter-btn active" data-value="all">All</button>
        <button class="filter-btn" data-value="yes">Wagered</button>
      </div>
    </div>

    <div class="table-header">
      <div class="count" id="count"></div>
      <button class="toggle-btn" id="toggleDetails" onclick="toggleDetailCols()">+ Details</button>
    </div>

    <div class="table-container">
      <div class="table-scroll">
        <table>
          <thead>
            <tr>
              <th data-sort="player_name">Player</th>
              <th data-sort="stat">Stat</th>
              <th data-sort="line">Line</th>
              <th data-sort="odds">Odds</th>
              <th data-sort="tier">Tier</th>
              <th data-sort="direction">Play</th>
              <th>Wager</th>
              <th data-sort="actual">Actual</th>
              <th data-sort="result">Result</th>
              <th data-sort="matchup" class="detail-col hidden">Matchup</th>
              <th data-sort="avg" class="detail-col hidden">Avg</th>
              <th data-sort="l10" class="detail-col hidden">L10</th>
              <th data-sort="proj" class="detail-col hidden">Proj</th>
            </tr>
          </thead>
          <tbody id="tableBody"></tbody>
        </table>
      </div>
    </div>
  </div>

  <div id="parlayBar" class="parlay-bar">
    <div class="parlay-tabs" id="parlayTabs"></div>
    <div class="parlay-header" onclick="toggleParlayExpand()">
      <span><span id="parlayCount">0</span> Picks</span>
      <div style="display: flex; align-items: center; gap: 16px;">
        <span id="parlayOddsSmall" style="color: var(--text-secondary);">—</span>
        <span id="parlayPayoutSmall" style="color: var(--green); font-weight: 600;">—</span>
        <span id="parlayExpand">▲</span>
      </div>
    </div>
    <div id="parlayDetails" class="parlay-details">
      <div id="parlayLegs"></div>
      <div style="display: flex; justify-content: space-between; align-items: center; padding-top: 12px; border-top: 1px solid var(--border); margin-top: 10px;">
        <button class="toggle-btn" onclick="clearParlay()">Clear</button>
        <div style="display: flex; gap: 20px; align-items: center;">
          <div><span class="stat-label">Odds</span> <strong id="parlayOdds">—</strong></div>
          <div>
            <span class="stat-label">Wager</span>
            <button class="wager-btn" id="parlayWagerBtn" onclick="cycleParlayWager()">—</button>
          </div>
          <div><span class="stat-label">Payout</span> <strong id="parlayPayout" style="color: var(--green);">—</strong></div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const allPicks = [{"player_name": "Russell Westbrook", "team": "SAC", "matchup": "SAC vs NYK", "stat": "assists", "line": 6.5, "odds": 116, "avg": 6.9, "l10": 6.0, "proj": 5.3, "edge": -13.3, "direction": "UNDER", "actual": null, "result": null, "tier": "play", "confidence": 70, "reasons": "Market: over @ medium (strength=0.067); Contrarian under vs medium market (allowed - 50% WR, +5% ROI); Contrarian UNDER @ medium market", "risks": "Against market direction"}, {"player_name": "Aaron Nesmith", "team": "IND", "matchup": "IND vs TOR", "stat": "points", "line": 15.5, "odds": -106, "avg": 14.2, "l10": 12.4, "proj": 11.8, "edge": -12.2, "direction": "UNDER", "actual": null, "result": null, "tier": "play", "confidence": 60, "reasons": "Market: over @ weak (strength=0.016); Contrarian UNDER @ weak market; Model edge: -12.2%", "risks": "Against market direction"}, {"player_name": "Malik Monk", "team": "SAC", "matchup": "SAC vs NYK", "stat": "rebounds", "line": 2.5, "odds": 115, "avg": 2.0, "l10": 1.8, "proj": 1.8, "edge": -13.9, "direction": "UNDER", "actual": null, "result": null, "tier": "play", "confidence": 57, "reasons": "Market: over @ medium (strength=0.066); Contrarian under vs medium market (allowed - 50% WR, +5% ROI); Contrarian UNDER @ medium market", "risks": "Against market direction"}, {"player_name": "Naji Marshall", "team": "DAL", "matchup": "DAL vs DEN", "stat": "rebounds", "line": 4.5, "odds": 110, "avg": 4.6, "l10": 3.7, "proj": 3.6, "edge": -13.1, "direction": "UNDER", "actual": null, "result": null, "tier": "play", "confidence": 57, "reasons": "Market: over @ medium (strength=0.056); Contrarian under vs medium market (allowed - 50% WR, +5% ROI); Contrarian UNDER @ medium market", "risks": "Against market direction"}, {"player_name": "Malik Monk", "team": "SAC", "matchup": "SAC vs NYK", "stat": "assists", "line": 3.5, "odds": -110, "avg": 2.4, "l10": 2.2, "proj": 2.5, "edge": -11.2, "direction": "UNDER", "actual": null, "result": null, "tier": "play", "confidence": 57, "reasons": "Market: over @ weak (strength=0.010); Contrarian UNDER @ weak market; Model edge: -11.2%", "risks": "Against market direction"}, {"player_name": "Noah Clowney", "team": "BKN", "matchup": "BKN @ NOP", "stat": "rebounds", "line": 3.5, "odds": 118, "avg": 3.9, "l10": 3.4, "proj": 3.2, "edge": -10.5, "direction": "UNDER", "actual": null, "result": null, "tier": "play", "confidence": 57, "reasons": "Market: over @ strong (strength=0.072); Contrarian under vs strong market (allowed - 50% WR, +5% ROI); Contrarian UNDER @ strong market", "risks": "Against market direction"}, {"player_name": "Zach LaVine", "team": "SAC", "matchup": "SAC vs NYK", "stat": "assists", "line": 2.5, "odds": -109, "avg": 2.3, "l10": 2.1, "proj": 1.8, "edge": -10.3, "direction": "UNDER", "actual": null, "result": null, "tier": "play", "confidence": 57, "reasons": "Market: over @ weak (strength=0.011); Contrarian UNDER @ weak market; Model edge: -10.3%", "risks": "Against market direction"}, {"player_name": "Jamal Shead", "team": "TOR", "matchup": "TOR @ IND", "stat": "rebounds", "line": 2.5, "odds": -106, "avg": 1.7, "l10": 1.1, "proj": 1.7, "edge": -10.1, "direction": "UNDER", "actual": null, "result": null, "tier": "play", "confidence": 57, "reasons": "Market: over @ weak (strength=0.017); Contrarian UNDER @ weak market; Model edge: -10.1%", "risks": "Against market direction"}, {"player_name": "Kris Dunn", "team": "LAC", "matchup": "LAC vs WAS", "stat": "assists", "line": 3.5, "odds": 108, "avg": 3.1, "l10": 3.4, "proj": 3.0, "edge": -10.0, "direction": "UNDER", "actual": null, "result": null, "tier": "play", "confidence": 57, "reasons": "Market: over @ medium (strength=0.052); Contrarian under vs medium market (allowed - 50% WR, +5% ROI); Contrarian UNDER @ medium market", "risks": "Against market direction"}];
    let filteredPicks = [...allPicks];
    let currentSort = { column: 'tier', direction: 'asc' }; // tier asc = strong first
    let filters = { stat: 'all', direction: 'all', tier: 'all', result: 'all', wagered: 'all', search: '' };
    let wagers = {}; // Store wagers by pick key (player_stat_line)
    let parlays = [{ legs: [], wager: 0 }]; // Array of parlays with legs and wager
    let activeParlayIdx = 0; // Current parlay being edited

    // Tier priority for sorting (lower = better)
    const tierOrder = { strong: 1, lean: 2, watch: 3, skip: 4 };

    function init() {
      setupEventListeners();
      applyFilters();
    }

    function setupEventListeners() {
      // Search
      document.getElementById('searchInput').addEventListener('input', (e) => {
        filters.search = e.target.value.toLowerCase();
        applyFilters();
      });

      // Filter buttons
      document.querySelectorAll('.filter-group').forEach(group => {
        const filterType = group.dataset.filter;
        group.querySelectorAll('.filter-btn').forEach(btn => {
          btn.addEventListener('click', () => {
            group.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            filters[filterType] = btn.dataset.value;
            applyFilters();
          });
        });
      });

      // Column sorting
      document.querySelectorAll('th[data-sort]').forEach(th => {
        th.addEventListener('click', () => {
          const column = th.dataset.sort;
          if (currentSort.column === column) {
            currentSort.direction = currentSort.direction === 'asc' ? 'desc' : 'asc';
          } else {
            currentSort.column = column;
            currentSort.direction = column === 'tier' ? 'asc' : (column === 'confidence' ? 'desc' : 'asc');
          }
          document.querySelectorAll('th').forEach(h => h.classList.remove('sorted-asc', 'sorted-desc'));
          th.classList.add('sorted-' + currentSort.direction);
          applyFilters();
        });
      });

      // Set initial sort indicator
      document.querySelector('th[data-sort="tier"]').classList.add('sorted-asc');
    }

    function applyFilters() {
      filteredPicks = allPicks.filter(p => {
        if (filters.stat !== 'all' && p.stat !== filters.stat) return false;
        if (filters.direction !== 'all' && p.direction !== filters.direction) return false;

        // Filter by model tier
        if (filters.tier !== 'all' && p.tier !== filters.tier) return false;

        if (filters.result !== 'all') {
          const r = p.result || 'PENDING';
          if (r !== filters.result) return false;
        }

        if (filters.search && !p.player_name.toLowerCase().includes(filters.search)) return false;

        // Wagered filter
        const pickKey = p.player_name + '_' + p.stat + '_' + p.line;
        if (filters.wagered === 'yes' && !wagers[pickKey]) return false;

        return true;
      });

      // Sort
      filteredPicks.sort((a, b) => {
        let aVal = a[currentSort.column];
        let bVal = b[currentSort.column];

        // Special handling for tier sorting (use order)
        if (currentSort.column === 'tier') {
          aVal = tierOrder[aVal] || 99;
          bVal = tierOrder[bVal] || 99;
          // Secondary sort by confidence when tiers are equal
          if (aVal === bVal) {
            return (b.confidence || 0) - (a.confidence || 0);
          }
        }

        if (aVal === null || aVal === undefined) aVal = currentSort.direction === 'asc' ? Infinity : -Infinity;
        if (bVal === null || bVal === undefined) bVal = currentSort.direction === 'asc' ? Infinity : -Infinity;

        if (typeof aVal === 'string') { aVal = aVal.toLowerCase(); bVal = (bVal || '').toLowerCase(); }

        if (aVal < bVal) return currentSort.direction === 'asc' ? -1 : 1;
        if (aVal > bVal) return currentSort.direction === 'asc' ? 1 : -1;
        return 0;
      });

      renderTable();
      updateStats();
      updateWagerStats();
    }

    function renderTable() {
      const tbody = document.getElementById('tableBody');

      if (filteredPicks.length === 0) {
        tbody.innerHTML = '<tr><td colspan="13" class="no-data">No picks match filters</td></tr>';
        document.getElementById('count').textContent = '';
        return;
      }

      tbody.innerHTML = filteredPicks.map(p => {
        const tier = p.tier || 'skip';
        const confidence = p.confidence || 0;
        const reasons = p.reasons || '';
        const risks = p.risks || '';
        const absEdge = Math.abs(p.edge || 0);
        const edgeSign = p.edge >= 0 ? '+' : '';

        const resultClass = (p.result || 'pending').toLowerCase();
        const actualClass = p.result === 'WIN' ? 'hit' : p.result === 'LOSS' ? 'miss' : '';
        const statAbbr = { points: 'PTS', rebounds: 'REB', assists: 'AST', threes: '3PM', steals: 'STL', blocks: 'BLK', turnovers: 'TO', pra: 'PRA', pr: 'P+R', pa: 'P+A', ra: 'R+A' }[p.stat] || p.stat.toUpperCase();

        const oddsDisplay = p.odds ? (p.odds > 0 ? '+' + p.odds : p.odds) : '—';
        const detailHidden = document.querySelector('.detail-col.hidden') ? 'hidden' : '';

        // Build tooltip HTML
        let tipHtml = '';
        if (reasons || risks || absEdge > 0) {
          tipHtml = `<div class="tier-tip">`;
          if (reasons) {
            tipHtml += `<div class="tip-section"><div class="tip-label">Why</div><div class="tip-text">${reasons}</div></div>`;
          }
          if (risks) {
            tipHtml += `<div class="tip-section"><div class="tip-label">Risks</div><div class="tip-text tip-risks">${risks}</div></div>`;
          }
          tipHtml += `<div class="tip-edge"><span>Edge</span><span>${edgeSign}${absEdge.toFixed(1)}%</span></div>`;
          tipHtml += `</div>`;
        }

        return `
          <tr>
            <td>
              <div class="player-cell">
                <span class="player-name">${p.player_name}</span>
                <span class="player-team">${p.team} ${p.matchup ? '· ' + p.matchup : ''}</span>
              </div>
            </td>
            <td>${statAbbr}</td>
            <td>${p.line}</td>
            <td style="color: var(--text-secondary);">${oddsDisplay}</td>
            <td>
              <div class="tier-wrap">
                <span class="tier ${tier}">${tier}<span class="conf">${confidence}</span></span>
                ${tipHtml}
              </div>
            </td>
            <td>
              <span class="dir ${p.direction.toLowerCase()}">${p.direction}</span>
              <button class="parlay-add${parlays[activeParlayIdx].legs.some(x => x.key === p.player_name + '_' + p.stat + '_' + p.line) ? ' in-parlay' : ''}" onclick="toggleParlay('${p.player_name}', '${p.stat}', ${p.line}, ${p.odds || -110}, '${p.direction}', '${p.result || ''}')" title="Add to parlay">+</button>
            </td>
            <td>${p.result === 'VOID' ? '<span style="color:var(--text-muted)">—</span>' : `<button class="wager-btn" data-key="${p.player_name}_${p.stat}_${p.line}" data-odds="${p.odds || -110}" data-result="${p.result || ''}" onclick="cycleWager(this)">${wagers[p.player_name + '_' + p.stat + '_' + p.line] || '—'}</button>`}</td>
            <td class="actual ${actualClass}">${p.actual !== null ? p.actual : '—'}</td>
            <td><span class="result ${resultClass}">${p.result || 'Pend'}</span></td>
            <td class="detail-col ${detailHidden}">${p.matchup || '—'}</td>
            <td class="detail-col ${detailHidden}">${p.avg ?? '—'}</td>
            <td class="detail-col ${detailHidden}">${p.l10 ?? '—'}</td>
            <td class="detail-col ${detailHidden}">${p.proj ?? '—'}</td>
          </tr>
        `;
      }).join('');

      document.getElementById('count').textContent = `${filteredPicks.length} of ${allPicks.length}`;
    }

    function updateStats() {
      const wins = filteredPicks.filter(p => p.result === 'WIN').length;
      const losses = filteredPicks.filter(p => p.result === 'LOSS').length;
      const pending = filteredPicks.filter(p => !p.result).length;
      const total = wins + losses;

      document.getElementById('record').innerHTML =
        `<span class="positive">${wins}</span>-<span class="negative">${losses}</span>`;

      const winRate = total > 0 ? ((wins / total) * 100).toFixed(1) : '—';
      const winRateEl = document.getElementById('winRate');
      winRateEl.textContent = total > 0 ? winRate + '%' : '—';
      winRateEl.className = 'stat-value ' + (parseFloat(winRate) >= 52.4 ? 'positive' : parseFloat(winRate) < 50 ? 'negative' : '');

      document.getElementById('pending').textContent = pending;
    }

    const wagerUnits = ['—', '$5', '$10', '$25', '$50', '$100'];

    function cycleWager(btn) {
      const current = btn.textContent;
      const idx = wagerUnits.indexOf(current);
      const next = wagerUnits[(idx + 1) % wagerUnits.length];
      btn.textContent = next;
      btn.classList.toggle('active', next !== '—');

      // Store wager by key
      const key = btn.dataset.key;
      if (next === '—') {
        delete wagers[key];
      } else {
        wagers[key] = next;
      }

      updateWagerStats();
    }

    function calcProfit(wager, odds, result) {
      if (result === 'WIN') {
        // Positive odds: profit = wager * (odds / 100)
        // Negative odds: profit = wager * (100 / abs(odds))
        if (odds > 0) return wager * (odds / 100);
        return wager * (100 / Math.abs(odds));
      } else if (result === 'LOSS') {
        return -wager;
      }
      return 0; // pending
    }

    function updateWagerStats() {
      let totalWagered = 0;
      let totalProfit = 0;

      // Count individual pick wagers (only visible rows)
      document.querySelectorAll('#tableBody tr .wager-btn').forEach(btn => {
        const wagerText = btn.textContent;
        if (wagerText === '—') return;

        const wager = parseInt(wagerText.replace('$', ''));
        const odds = parseInt(btn.dataset.odds) || -110;
        const result = btn.dataset.result.toUpperCase();

        if (result === 'WIN' || result === 'LOSS') {
          totalWagered += wager;
          totalProfit += calcProfit(wager, odds, result);
        }
      });

      // Count parlay wagers
      parlays.forEach(parlay => {
        if (parlay.wager > 0 && parlay.legs.length > 0) {
          const result = getParlayResult(parlay);
          if (result === 'WIN') {
            totalWagered += parlay.wager;
            const decimalOdds = getParlayDecimalOdds(parlay);
            totalProfit += parlay.wager * (decimalOdds - 1); // profit = wager * (decimal - 1)
          } else if (result === 'LOSS') {
            totalWagered += parlay.wager;
            totalProfit -= parlay.wager;
          }
          // PENDING parlays don't count in ROI yet
        }
      });

      document.getElementById('totalWagered').textContent = '$' + totalWagered;

      const profitEl = document.getElementById('totalProfit');
      profitEl.textContent = (totalProfit >= 0 ? '+$' : '-$') + Math.abs(totalProfit).toFixed(0);
      profitEl.className = 'stat-value ' + (totalProfit > 0 ? 'positive' : totalProfit < 0 ? 'negative' : '');

      const roiEl = document.getElementById('wagerRoi');
      if (totalWagered > 0) {
        const roi = (totalProfit / totalWagered * 100).toFixed(1);
        roiEl.textContent = roi + '%';
        roiEl.className = 'stat-value ' + (totalProfit > 0 ? 'positive' : totalProfit < 0 ? 'negative' : '');
      } else {
        roiEl.textContent = '—';
        roiEl.className = 'stat-value';
      }
    }

    function toggleParlay(player, stat, line, odds, direction, result) {
      const key = player + '_' + stat + '_' + line;
      const parlay = parlays[activeParlayIdx];
      const idx = parlay.legs.findIndex(x => x.key === key);

      if (idx >= 0) {
        parlay.legs.splice(idx, 1);
      } else {
        parlay.legs.push({ key, player, stat, line, odds, direction, result });
      }

      updateParlayUI();
      renderTable();
    }

    function removeFromParlay(key) {
      const parlay = parlays[activeParlayIdx];
      const idx = parlay.legs.findIndex(x => x.key === key);
      if (idx >= 0) parlay.legs.splice(idx, 1);
      updateParlayUI();
      renderTable();
    }

    function clearParlay() {
      parlays[activeParlayIdx] = { legs: [], wager: 0 };
      updateParlayUI();
      renderTable();
    }

    function addNewParlay() {
      parlays.push({ legs: [], wager: 0 });
      activeParlayIdx = parlays.length - 1;
      updateParlayUI();
      renderTable();
    }

    function switchParlay(idx) {
      activeParlayIdx = idx;
      updateParlayUI();
      renderTable();
    }

    function deleteParlay(idx) {
      if (parlays.length <= 1) {
        parlays[0] = { legs: [], wager: 0 };
      } else {
        parlays.splice(idx, 1);
        if (activeParlayIdx >= parlays.length) activeParlayIdx = parlays.length - 1;
      }
      updateParlayUI();
      renderTable();
    }

    function setParlayWager(idx, amount) {
      parlays[idx].wager = amount;
      updateParlayUI();
    }

    function cycleParlayWager() {
      const btn = document.getElementById('parlayWagerBtn');
      const current = btn.textContent;
      const idx = wagerUnits.indexOf(current);
      const next = wagerUnits[(idx + 1) % wagerUnits.length];
      btn.textContent = next;
      btn.classList.toggle('active', next !== '—');

      parlays[activeParlayIdx].wager = next === '—' ? 0 : parseInt(next.replace('$', ''));
      updateParlayUI();
    }

    function getParlayResult(parlay) {
      if (parlay.legs.length === 0) return 'EMPTY';
      const results = parlay.legs.map(leg => leg.result?.toUpperCase());
      if (results.some(r => !r || r === 'PENDING')) return 'PENDING';
      if (results.some(r => r === 'LOSS')) return 'LOSS';
      if (results.every(r => r === 'WIN')) return 'WIN';
      return 'PENDING';
    }

    function getParlayDecimalOdds(parlay) {
      let decimalOdds = 1;
      parlay.legs.forEach(leg => {
        if (leg.odds > 0) {
          decimalOdds *= (leg.odds / 100) + 1;
        } else {
          decimalOdds *= (100 / Math.abs(leg.odds)) + 1;
        }
      });
      return decimalOdds;
    }

    function updateParlayUI() {
      const bar = document.getElementById('parlayBar');
      const legsDiv = document.getElementById('parlayLegs');
      const tabsDiv = document.getElementById('parlayTabs');
      const parlay = parlays[activeParlayIdx];

      // Check if any parlay has picks
      const totalPicks = parlays.reduce((sum, p) => sum + p.legs.length, 0);
      if (totalPicks === 0) {
        bar.classList.remove('visible');
        document.body.classList.remove('has-parlay');
        return;
      }

      bar.classList.add('visible');
      document.body.classList.add('has-parlay');

      // Render tabs with result indicator
      tabsDiv.innerHTML = parlays.map((p, i) => {
        const active = i === activeParlayIdx ? ' active' : '';
        const result = getParlayResult(p);
        const resultIcon = result === 'WIN' ? '✓' : result === 'LOSS' ? '✗' : '';
        const resultStyle = result === 'WIN' ? 'color:#059669;' : result === 'LOSS' ? 'color:#dc2626;' : '';
        return `<button class="parlay-tab${active}" onclick="switchParlay(${i})">
          <span style="${resultStyle}">${resultIcon} P${i + 1} (${p.legs.length})</span>
          ${parlays.length > 1 ? `<span onclick="event.stopPropagation(); deleteParlay(${i})" style="margin-left: 4px; color: #94a3b8;">&times;</span>` : ''}
        </button>`;
      }).join('') + `<button class="parlay-tab add" onclick="addNewParlay()">+</button>`;

      document.getElementById('parlayCount').textContent = parlay.legs.length;

      // Parlay result status
      const parlayResult = getParlayResult(parlay);
      const resultBadge = parlayResult === 'WIN' ? '<span style="color:#059669;font-weight:600;">✓ WIN</span>'
        : parlayResult === 'LOSS' ? '<span style="color:#dc2626;font-weight:600;">✗ LOSS</span>'
        : parlayResult === 'PENDING' && parlay.legs.length > 0 ? '<span style="color:#3b82f6;">PENDING</span>'
        : '';

      legsDiv.innerHTML = parlay.legs.length === 0
        ? '<div style="color: #94a3b8; font-size: 12px; padding: 8px 0;">No picks in this parlay</div>'
        : parlay.legs.map(leg => {
          const oddsStr = leg.odds > 0 ? '+' + leg.odds : leg.odds;
          const statAbbr = { points: 'PTS', rebounds: 'REB', assists: 'AST' }[leg.stat] || leg.stat;
          const legResult = (leg.result || '').toUpperCase();
          const legStyle = legResult === 'WIN' ? 'color:#059669;' : legResult === 'LOSS' ? 'color:#dc2626;' : '';
          const legIcon = legResult === 'WIN' ? '✓ ' : legResult === 'LOSS' ? '✗ ' : '';
          return `<div class="parlay-leg" style="${legStyle}">
            <span>${legIcon}${leg.player} <strong>${leg.direction}</strong> ${statAbbr} ${leg.line} <span style="color:#94a3b8">(${oddsStr})</span></span>
            <span class="remove" onclick="removeFromParlay('${leg.key}')">&times;</span>
          </div>`;
        }).join('');

      // Sync wager button with parlay state
      const wagerBtn = document.getElementById('parlayWagerBtn');
      if (wagerBtn) {
        const wagerText = parlay.wager > 0 ? '$' + parlay.wager : '—';
        wagerBtn.textContent = wagerText;
        wagerBtn.classList.toggle('active', parlay.wager > 0);
      }

      // Calculate combined odds for active parlay
      if (parlay.legs.length > 0) {
        const decimalOdds = getParlayDecimalOdds(parlay);

        let americanOdds;
        if (decimalOdds >= 2) {
          americanOdds = '+' + Math.round((decimalOdds - 1) * 100);
        } else {
          americanOdds = Math.round(-100 / (decimalOdds - 1));
        }

        const displayWager = parlay.wager > 0 ? parlay.wager : 10;
        const payout = '$' + (displayWager * decimalOdds).toFixed(2);
        document.getElementById('parlayOdds').textContent = americanOdds;
        document.getElementById('parlayOddsSmall').innerHTML = americanOdds + ' ' + resultBadge;
        document.getElementById('parlayPayout').textContent = payout;
        document.getElementById('parlayPayoutSmall').textContent = payout;
      } else {
        document.getElementById('parlayOdds').textContent = '—';
        document.getElementById('parlayOddsSmall').textContent = '—';
        document.getElementById('parlayPayout').textContent = '—';
        document.getElementById('parlayPayoutSmall').textContent = '—';
      }

      updateWagerStats();
    }

    function toggleParlayExpand() {
      const details = document.getElementById('parlayDetails');
      const arrow = document.getElementById('parlayExpand');
      details.classList.toggle('expanded');
      arrow.textContent = details.classList.contains('expanded') ? '▼' : '▲';
    }

    function toggleDetailCols() {
      const cols = document.querySelectorAll('.detail-col');
      const btn = document.getElementById('toggleDetails');
      const isHidden = cols[0]?.classList.contains('hidden');

      cols.forEach(col => {
        if (isHidden) {
          col.classList.remove('hidden');
        } else {
          col.classList.add('hidden');
        }
      });

      btn.textContent = isHidden ? '− Details' : '+ Details';
    }

    function toggleTheme() {
      const html = document.documentElement;
      const btn = document.getElementById('themeToggle');
      const current = html.getAttribute('data-theme');

      if (current === 'light') {
        html.removeAttribute('data-theme');
        btn.textContent = '☀';
        localStorage.setItem('theme', 'dark');
      } else {
        html.setAttribute('data-theme', 'light');
        btn.textContent = '🌙';
        localStorage.setItem('theme', 'light');
      }
    }

    // Load saved theme
    (function() {
      const saved = localStorage.getItem('theme');
      if (saved === 'light') {
        document.documentElement.setAttribute('data-theme', 'light');
        document.getElementById('themeToggle').textContent = '🌙';
      }
    })();

    init();
  </script>
</body>
</html>
